<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <!-- Bayangan luar -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#051510" flood-opacity="0.6"/>
    </filter>

    <!-- Gradien Emas Aceh -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D49B2A"/>
      <stop offset="100%" stop-color="#8C5E0B"/>
    </linearGradient>

    <!-- Gradien Merah Marun Aceh -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B22B3E"/>
      <stop offset="60%" stop-color="#6B131F"/>
      <stop offset="100%" stop-color="#36080E"/>
    </linearGradient>

    <!-- Gradien Hijau Zamrud Tropis -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#236954"/>
      <stop offset="100%" stop-color="#0A241C"/>
    </linearGradient>
  </defs>

  <!-- Piringan Pelindung Dasar (Ornamen Perisai Aceh) -->
  <g filter="url(#shadow)">
    <!-- Cincin Luar Emas Bermotif -->
    <circle cx="90" cy="95" r="76" fill="#120A0B" stroke="url(#goldGrad)" stroke-width="4.5"/>
    <circle cx="90" cy="95" r="70" fill="none" stroke="#D49B2A" stroke-dasharray="4, 4" stroke-width="1.5" opacity="0.8"/>

    <!-- Pundak & Pakaian Adat Aceh (Baju Meukasah Hitam Beludru + Sulaman Emas) -->
    <path d="M 40 145 C 50 115, 130 115, 140 145 C 120 162, 60 162, 40 145 Z" fill="#0D1A15" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <!-- Selendang / Kerah Siwah Emas -->
    <path d="M 68 130 L 90 152 L 112 130 Z" fill="url(#goldGrad)" opacity="0.9"/>

    <!-- Lengan & Tangan Membidik ke Arah Depan (Atas) -->
    <path d="M 45 125 C 40 100, 52 75, 72 65 C 75 75, 70 95, 60 120 Z" fill="#0D1A15" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <path d="M 135 125 C 140 100, 128 75, 108 65 C 105 75, 110 95, 120 120 Z" fill="#0D1A15" stroke="url(#goldGrad)" stroke-width="1.8"/>

    <!-- Pelontar Pusaka Rencong / Penyangga Kelereng (Menghadap Atas) -->
    <path d="M 83 52 L 90 28 L 97 52 Z" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="1.5"/>
    <circle cx="90" cy="26" r="4" fill="#FFE082"/>

    <!-- Kepala Karakter -->
    <circle cx="90" cy="95" r="32" fill="#E8C39E"/>

    <!-- Kupiah Meukeutop (Peci Kebesaran Adat Aceh yang Ikonik) -->
    <!-- Tingkat 1: Lapisan Merah Marun Bermotif -->
    <ellipse cx="90" cy="92" rx="30" ry="24" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Tingkat 2: Lapisan Hijau Segi Empat Khas -->
    <ellipse cx="90" cy="87" rx="22" ry="17" fill="url(#greenGrad)" stroke="#FFE082" stroke-width="1.5"/>
    <!-- Tingkat 3: Puncak Kuning Keemasan -->
    <ellipse cx="90" cy="82" rx="14" ry="11" fill="url(#goldGrad)" stroke="#8C5E0B" stroke-width="1"/>
    <!-- Tampuk / Mahkota Emas Kupiah di Puncak -->
    <circle cx="90" cy="78" r="5.5" fill="#FFE082" stroke="#B8860B" stroke-width="1.2"/>
    <circle cx="90" cy="78" r="2.5" fill="#8B1E2D"/>

    <!-- Motif Anyaman Tangga Tradisional pada Kupiah -->
    <line x1="72" y1="92" x2="108" y2="92" stroke="#FFE082" stroke-width="1" stroke-dasharray="2, 2"/>
    <line x1="76" y1="87" x2="104" y2="87" stroke="#FFE082" stroke-width="1" stroke-dasharray="2, 2"/>

    <!-- Arah Panah Bidikan Cahaya di Depan Peluncur -->
    <polygon points="90,14 84,23 96,23" fill="#FFE082" opacity="0.9"/>
  </g>
</svg>
