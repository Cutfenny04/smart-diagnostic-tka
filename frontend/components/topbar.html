<header class="topbar" id="topbar">
    <button type="button" class="topbar__menu-btn" id="sidebarDrawerBtn" aria-label="Buka menu navigasi" aria-expanded="false">
        <i data-lucide="menu"></i>
    </button>

    <div class="topbar__spacer"></div>

    <div class="topbar__actions">
        <button type="button" class="btn-icon topbar__notif-btn" id="notifBtn" aria-label="Notifikasi" aria-haspopup="true" aria-expanded="false">
            <i data-lucide="bell"></i>
            <span class="topbar__notif-dot" aria-hidden="true"></span>
        </button>

        <div class="topbar__notif-panel" id="notifPanel" role="menu" hidden>
            <div class="topbar__notif-panel-header">Notifikasi</div>
            <div class="empty-state empty-state--compact">
                <div class="empty-state__icon"><i data-lucide="bell-off"></i></div>
                <p class="empty-state__desc">Belum ada notifikasi baru.</p>
            </div>
        </div>

        <button type="button" class="topbar__profile-btn" id="profileBtn" aria-haspopup="true" aria-expanded="false">
            <span class="topbar__avatar" id="profileAvatar" aria-hidden="true">G</span>
            <span class="topbar__profile-info">
                <span class="topbar__profile-name" id="profileName">Guru</span>
                <span class="topbar__profile-role">Guru IPA</span>
            </span>
            <i data-lucide="chevron-down" class="topbar__profile-caret"></i>
        </button>

        <div class="topbar__profile-menu" id="profileMenu" role="menu" hidden>
            <a href="profil.html" role="menuitem" class="topbar__profile-menu-item">
                <i data-lucide="user"></i> Profil Saya
            </a>
            <a href="ubah-password.html" role="menuitem" class="topbar__profile-menu-item">
                <i data-lucide="lock"></i> Ubah Password
            </a>
            <a href="login.html" role="menuitem" class="topbar__profile-menu-item topbar__profile-menu-item--danger">
                <i data-lucide="log-out"></i> Keluar
            </a>
        </div>
    </div>
</header>
