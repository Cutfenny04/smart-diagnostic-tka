<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Password - Smart Diagnostic TKA</title>
    <meta name="description" content="Ubah password akun guru - Smart Diagnostic TKA.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Shared Design System -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Page Specific -->
    <link rel="stylesheet" href="assets/css/ubah-password.css">
</head>
<body data-page="profil">
    <div class="app-shell">
        <div data-include="sidebar"></div>
        <div class="sidebar-overlay"></div>

        <div class="app-shell__main">
            <div data-include="topbar"></div>

            <main class="content">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="dashboard.html">Beranda</a>
                    <span class="breadcrumb__sep">/</span>
                    <a href="profil.html">Profil</a>
                    <span class="breadcrumb__sep">/</span>
                    <span class="breadcrumb__current" aria-current="page">Ubah Password</span>
                </nav>

                <!-- Header -->
                <div class="page-header">
                    <div class="page-header__text">
                        <h1 class="page-header__title">Ubah Password</h1>
                        <p class="page-header__desc">Perbarui password akun Anda secara berkala untuk menjaga keamanan.</p>
                    </div>
                </div>

                <!-- Form Ubah Password -->
                <div class="card-light ubah-password-form" id="ubahPasswordCard">
                    <form id="ubahPasswordForm" novalidate>
                        <div class="form-field" id="field-oldPassword">
                            <label class="form-field__label" for="oldPassword">Password Lama<span class="form-field__required">*</span></label>
                            <input type="password" id="oldPassword" name="oldPassword" class="form-field__input" placeholder="Masukkan password lama" autocomplete="current-password">
                            <span class="form-field__error" id="oldPasswordError">Password lama wajib diisi.</span>
                        </div>

                        <div class="form-field" id="field-newPassword">
                            <label class="form-field__label" for="newPassword">Password Baru<span class="form-field__required">*</span></label>
                            <input type="password" id="newPassword" name="newPassword" class="form-field__input" placeholder="Minimal 6 karakter" autocomplete="new-password">
                            <span class="form-field__error" id="newPasswordError">Password baru wajib diisi (minimal 6 karakter).</span>
                        </div>

                        <div class="form-field" id="field-confirmPassword">
                            <label class="form-field__label" for="confirmPassword">Konfirmasi Password Baru<span class="form-field__required">*</span></label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-field__input" placeholder="Ulangi password baru" autocomplete="new-password">
                            <span class="form-field__error" id="confirmPasswordError">Konfirmasi password tidak cocok.</span>
                        </div>

                        <div class="form-actions">
                            <a href="profil.html" class="btn btn-secondary">Batal</a>
                            <button type="submit" class="btn btn-primary" id="submitBtn"><i data-lucide="lock"></i> Simpan Password Baru</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Shared Shell Script -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/api-config.js"></script>
    <!-- Page Specific (ES module — imports its data from assets/data/auth.js) -->
    <script type="module" src="assets/js/ubah-password.js"></script>
</body>
</html>
